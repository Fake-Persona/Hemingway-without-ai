  const spans = [];

  // Records [from, to) with surrounding whitespace trimmed off, keeping the
  // absolute index of where the trimmed text actually begins.
  const push = (from, to) => {
    let start = from;
    let end = to;
    while (start < end && /\s/.test(paragraph[start])) start++;
    while (end > start && /\s/.test(paragraph[end - 1])) end--;
    if (end > start) spans.push({ text: paragraph.slice(start, end), start });
  };

  let sentenceStart = 0;
  let i = 0;
  while (i < paragraph.length) {
    if (/[.!?]/.test(paragraph[i])) {
      let end = i;
      while (end + 1 < paragraph.length && /[.!?]/.test(paragraph[end + 1])) end++;
      const nextChar = paragraph[end + 1];
      if (nextChar === undefined || /\s/.test(nextChar)) {
        push(sentenceStart, end + 1);
        sentenceStart = end + 1;
      }
      i = end + 1;
    } else {
      i++;
    }
  }
  if (sentenceStart < paragraph.length) push(sentenceStart, paragraph.length);

  return spans;
}

function splitIntoSentences(paragraph) {
  return splitIntoSentencesWithOffsets(paragraph).map(span => span.text);
}

function countWordsAndLetters(sentence) {
  const clean = sentence.replace(/[^a-z0-9. ]/gi, "");
  const words = clean.split(/\s+/).filter(Boolean);
  const letters = words.join("").length;
  return { wordCount: words.length, letterCount: letters };
}

// Simplified Flesch-Kincaid-style grade level, matching the original's
// letters-per-word approximation (no syllable counting).
function calculateGradeLevel(letterCount, wordCount, sentenceCount) {
  if (wordCount === 0 || sentenceCount === 0) return 0;
  const grade = Math.round(
    4.71 * (letterCount / wordCount) + (0.5 * wordCount) / sentenceCount - 21.43
  );
  return grade <= 0 ? 0 : grade;
}

function gradeLevelLabel(grade) {
  if (grade <= 8) return "Great — easy to read";
  if (grade <= 12) return "Good";
  if (grade <= 16) return "Fairly difficult";
  return "Very difficult";
}

function addRange(ranges, start, end, type, tooltip) {
  if (end <= start) return;
  ranges.push({ start, end, type, tooltip });
}

// Finds every non-overlapping occurrence of `phrase` (word-boundary aware)
// in `lowerText` and pushes a highlight range for each.
function findPhraseRanges(lowerText, phrase, type, ranges, tooltip) {
  const pattern = new RegExp(`\\b${escapeRegExp(phrase)}\\b`, "gi");
  let match;
  while ((match = pattern.exec(lowerText)) !== null) {
    addRange(ranges, match.index, match.index + match[0].length, type, tooltip);
    if (match[0].length === 0) pattern.lastIndex++;
  }
}

function findAdverbRanges(sentence, ranges) {
  const pattern = /[A-Za-z']+/g;
  let match;
  while ((match = pattern.exec(sentence)) !== null) {
    const word = match[0];
    const lower = word.toLowerCase();
    if (lower.endsWith("ly") && !NON_ADVERB_LY_WORDS.has(lower)) {
      addRange(ranges, match.index, match.index + word.length, "adverb", null);
    }
  }
}

function findPassiveRanges(sentence, ranges) {
  const pattern = /[A-Za-z']+/g;
  const tokens = [];
  let match;
  while ((match = pattern.exec(sentence)) !== null) {
    tokens.push({ word: match[0], start: match.index, end: match.index + match[0].length });
  }
  for (let i = 0; i < tokens.length - 1; i++) {
    const first = tokens[i].word.toLowerCase();
    const second = tokens[i + 1].word.toLowerCase();
    if (!BE_VERBS.has(first)) continue;
    const isPastParticiple = second.endsWith("ed") || IRREGULAR_PAST_PARTICIPLES.has(second);
    if (isPastParticiple) {
      addRange(ranges, tokens[i].start, tokens[i + 1].end, "passive", null);
    }
  }
}

function findComplexRanges(sentence, ranges) {
  const lower = sentence.toLowerCase();
  for (const phrase of Object.keys(COMPLEX_WORDS)) {
    const alternatives = COMPLEX_WORDS[phrase];
    findPhraseRanges(lower, phrase, "complex", ranges, `Try: ${alternatives.join(", ")}`);
  }
}

function findQualifierRanges(sentence, ranges) {
  const lower = sentence.toLowerCase();
  for (const phrase of QUALIFYING_PHRASES) {
    findPhraseRanges(lower, phrase, "qualifier", ranges, null);
  }
}

// Removes lower-priority ranges that overlap a higher-priority one, and
// sorts what's left by start position so the renderer can walk them in order.
function resolveOverlaps(ranges) {
  const priorityOf = type => HIGHLIGHT_PRIORITY.indexOf(type);
  const sorted = [...ranges].sort((a, b) => priorityOf(a.type) - priorityOf(b.type));
  const accepted = [];
  for (const range of sorted) {
    const overlaps = accepted.some(a => range.start < a.end && range.end > a.start);
    if (!overlaps) accepted.push(range);
  }
  return accepted.sort((a, b) => a.start - b.start);
}

// Analyzes a single sentence and returns its plain text plus a list of
// non-overlapping highlight ranges (character offsets into that text).
function analyzeSentence(sentence) {
  const { wordCount, letterCount } = countWordsAndLetters(sentence);
  const ranges = [];

  findAdverbRanges(sentence, ranges);
  findComplexRanges(sentence, ranges);
  findPassiveRanges(sentence, ranges);
  findQualifierRanges(sentence, ranges);

  const grade = calculateGradeLevel(letterCount, wordCount, 1);
  let difficulty = null;
  if (wordCount >= 14) {
    if (grade >= 14) difficulty = "veryHardSentence";
    else if (grade >= 10) difficulty = "hardSentence";
  }

  return {
    text: sentence,
    wordCount,
    letterCount,
    difficulty,
    ranges: resolveOverlaps(ranges)
  };
}

// Analyzes the full document text and returns per-paragraph sentence
// breakdowns plus aggregate counts and an overall grade level.
function analyzeText(text) {
  const paragraphs = text.split("\n");
  const totals = {
    paragraphs: paragraphs.length,
    sentences: 0,
    words: 0,
    letters: 0,
    hardSentences: 0,
    veryHardSentences: 0,
    adverbs: 0,
    passiveVoice: 0,
    complex: 0,
    qualifiers: 0
  };

  // Tracks where each paragraph begins in `text` so every sentence can carry an
  // absolute start index (+1 per iteration for the "\n" that split removed).
  let paragraphStart = 0;

  const analyzedParagraphs = paragraphs.map(paragraph => {
    const offsetInText = paragraphStart;
    paragraphStart += paragraph.length + 1;

    const sentences = splitIntoSentencesWithOffsets(paragraph).map(span => {
      const analyzed = analyzeSentence(span.text);
      analyzed.start = offsetInText + span.start;
      totals.sentences += 1;
      totals.words += analyzed.wordCount;
      totals.letters += analyzed.letterCount;
      if (analyzed.difficulty === "hardSentence") totals.hardSentences += 1;
      if (analyzed.difficulty === "veryHardSentence") totals.veryHardSentences += 1;
      for (const range of analyzed.ranges) {
        if (range.type === "adverb") totals.adverbs += 1;
        else if (range.type === "passive") totals.passiveVoice += 1;
        else if (range.type === "complex") totals.complex += 1;
        else if (range.type === "qualifier") totals.qualifiers += 1;
      }
      return analyzed;
    });
    return { raw: paragraph, sentences };
  });

  const overallGrade = calculateGradeLevel(totals.letters, totals.words, totals.sentences);

  return { paragraphs: analyzedParagraphs, totals, overallGrade };
}

// Flattens an analysis into one list of highlights whose offsets are absolute
// to the analyzed text, ordered by position. This is what a consumer painting
// over text it did not render needs: it has no notion of paragraphs or
// sentences, only "which characters get which colour".
//
// Sentence-level difficulty comes before the word-level ranges inside it, so a
// caller drawing in order naturally layers the narrower highlight on top.
function flattenHighlights(analysis) {
  const highlights = [];

  for (const paragraph of analysis.paragraphs) {
    for (const sentence of paragraph.sentences) {
      if (sentence.difficulty) {
        highlights.push({
          start: sentence.start,
          end: sentence.start + sentence.text.length,
          type: sentence.difficulty
        });
      }
      for (const range of sentence.ranges) {
        highlights.push({
          start: sentence.start + range.start,
          end: sentence.start + range.end,
          type: range.type
        });
      }
    }
  }

  return highlights.sort((a, b) => a.start - b.start || b.end - a.end);
}

// ===== js/render.js =====
// Turns analyze.js output into HTML. All raw text is escaped before it is
// ever placed into a string that gets assigned to innerHTML, so arbitrary
// user input (including "<script>...<\/script>") can never execute.

const ESCAPE_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, ch => ESCAPE_MAP[ch]);
}

const LABELS = {
  adverb: "Adverb — consider cutting it",
  qualifier: "Qualifier/hedge — weakens the sentence",
  passive: "Passive voice",
  complex: null, // tooltip supplied per-range with suggested alternatives
  hardSentence: "Hard to read",
  veryHardSentence: "Very hard to read"
};

function tooltipFor(range) {
  if (range.tooltip) return range.tooltip;
  return LABELS[range.type] || null;
}

// Renders one analyzed sentence (see analyzeSentence in analyze.js) to an
// HTML string: word/phrase-level ranges are applied in a single left-to-right
// pass over the escaped text, then (if the sentence is hard/very hard to
// read) the whole thing is wrapped in an outer difficulty span, so sentence-
// level and word-level highlights nest instead of competing for the same span.
function renderSentence(analyzed) {
  const { text, ranges, difficulty } = analyzed;
  let html = "";
  let cursor = 0;

  for (const range of ranges) {
    if (range.start > cursor) {
      html += escapeHtml(text.slice(cursor, range.start));
    }
    const segment = escapeHtml(text.slice(range.start, range.end));
    const tooltip = tooltipFor(range);
    const titleAttr = tooltip ? ` title="${escapeHtml(tooltip)}"` : "";
    html += `<span class="${range.type}"${titleAttr}>${segment}</span>`;
    cursor = Math.max(cursor, range.end);
  }
  if (cursor < text.length) {
    html += escapeHtml(text.slice(cursor));
  }

  if (difficulty) {
    const titleAttr = ` title="${escapeHtml(LABELS[difficulty])}"`;
    html = `<span class="${difficulty}"${titleAttr}>${html}</span>`;
  }

  return html;
}

// Renders the full analyzed document (see analyzeText) to an HTML string
// suitable for the editor's contenteditable innerHTML.
function renderDocument(analysis) {
  return analysis.paragraphs
    .map(paragraph => {
      const sentenceHtml = paragraph.sentences.map(renderSentence).join(" ");
      return `<div class="paragraph">${sentenceHtml || "<br>"}</div>`;
    })
    .join("");
}

// ===== js/app.js =====
// Wires the contenteditable editor up to the analysis/render pipeline,
// keeps the caret in place across re-renders, normalizes pasted content to
// plain text, and drives the stats panel + dark mode toggle.




const DEBOUNCE_MS = 250;
const THEME_STORAGE_KEY = "hemingway-theme";

const DEFAULT_TEXT = `The app highlights lengthy, complex sentences and common errors; if you see a yellow sentence, shorten or split it. If you see a red highlight, your sentence is so dense and complicated that your readers will get lost trying to follow its meandering, splitting logic - try editing this sentence to remove the red.
You can utilize a shorter word in place of a purple one. Hover over them for hints.
Adverbs and weakening phrases are helpfully shown in blue. Get rid of them and pick words with force, perhaps.
Phrases in green have been marked to show passive voice.
Write something new, or paste in something you're already working on, then keep editing right here - the highlights update as you go.`;

const editor = document.getElementById("editor");
const themeToggle = document.getElementById("theme-toggle");
const gradeValueEl = document.getElementById("grade-value");
const gradeLabelEl = document.getElementById("grade-label");

const statEls = {
  adverb: document.getElementById("stat-adverb"),
  passive: document.getElementById("stat-passive"),
  complex: document.getElementById("stat-complex"),
  hardSentence: document.getElementById("stat-hard"),
  veryHardSentence: document.getElementById("stat-very-hard")
};

let debounceTimer = null;

// --- Caret position, expressed as a plain-text character offset from the
// start of the editor, so it survives a full innerHTML replacement. ---

function getCaretOffset(root) {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0) return null;
  const range = selection.getRangeAt(0);
  if (!root.contains(range.startContainer)) return null;
  const preRange = range.cloneRange();
  preRange.selectNodeContents(root);
  preRange.setEnd(range.endContainer, range.endOffset);
  return preRange.toString().length;
}

function setCaretOffset(root, offset) {
  if (offset === null) return;
  const selection = window.getSelection();
  const range = document.createRange();
  let remaining = offset;
  let targetNode = null;
  let targetOffset = 0;

  (function walk(node) {
    if (targetNode) return;
    if (node.nodeType === Node.TEXT_NODE) {
      const len = node.textContent.length;
      if (remaining <= len) {
        targetNode = node;
        targetOffset = remaining;
      } else {
        remaining -= len;
      }
      return;
    }
    for (const child of node.childNodes) {
      walk(child);
      if (targetNode) return;
    }
  })(root);

  if (targetNode) {
    range.setStart(targetNode, targetOffset);
  } else {
    range.selectNodeContents(root);
    range.collapse(false);
  }
  range.collapse(true);
  selection.removeAllRanges();
  selection.addRange(range);
}

// --- Analysis + render pipeline ---

function updateStats(totals, overallGrade) {
  const targetAdverbs = Math.max(1, Math.round(totals.sentences / 3));
  const targetPassive = Math.max(1, Math.round(totals.sentences / 5));

  statEls.adverb.innerHTML =
    `<strong>${totals.adverbs}</strong> adverb${totals.adverbs === 1 ? "" : "s"}. ` +
    `Aim for ${targetAdverbs} or fewer.`;
  statEls.passive.innerHTML =
    `Passive voice used <strong>${totals.passiveVoice}</strong> time${totals.passiveVoice === 1 ? "" : "s"}. ` +
    `Aim for ${targetPassive} or fewer.`;
  statEls.complex.innerHTML =
    `<strong>${totals.complex}</strong> phrase${totals.complex === 1 ? "" : "s"} could be simplified.`;
  statEls.hardSentence.innerHTML =
    `<strong>${totals.hardSentences}</strong> of ${totals.sentences} sentence${totals.sentences === 1 ? "" : "s"} ` +
    `${totals.sentences === 1 ? "is" : "are"} hard to read.`;
  statEls.veryHardSentence.innerHTML =
    `<strong>${totals.veryHardSentences}</strong> of ${totals.sentences} sentence${totals.sentences === 1 ? "" : "s"} ` +
    `${totals.sentences === 1 ? "is" : "are"} very hard to read.`;

  if (totals.words === 0) {
    gradeValueEl.textContent = "–";
    gradeLabelEl.textContent = "Start writing to see your grade level";
  } else {
    gradeValueEl.textContent = String(overallGrade);
    gradeLabelEl.textContent = gradeLevelLabel(overallGrade);
  }
}

// Reads the editor's text as the exact inverse of what renderDocument writes:
// one line per top-level block, joined by "\n".
//
// This deliberately avoids `innerText`, which reports a *rendered* view rather
// than our source. renderDocument emits `<div class="paragraph"><br></div>` to
// keep a blank line visible, and innerText reads that back as TWO newlines —
// one for the <br>, one for the block boundary. Feeding that back in produced
// two blank paragraphs, then four, then eight: whitespace doubling on every
// keystroke. textContent has no such rendering fiction, so the round-trip is
// stable.
//
// A trailing bare <br> is skipped: browsers park one at the end of a
// contenteditable purely to give the caret somewhere to sit, and it is not a
// line the user typed.
function readEditorText(editor) {
  const blocks = [];
  const children = [...editor.childNodes];

  children.forEach((node, index) => {
    if (node.nodeType === Node.TEXT_NODE) {
      blocks.push(node.data);
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    if (node.tagName === "BR") {
      const isTrailingCaretHolder = index === children.length - 1;
      if (!isTrailingCaretHolder) blocks.push("");
      return;
    }
    blocks.push(node.textContent);
  });

  return blocks.join("\n");
}

function runAnalysis() {
  const hasFocus = document.activeElement === editor;
  const caretOffset = hasFocus ? getCaretOffset(editor) : null;

  const text = readEditorText(editor);
  const analysis = analyzeText(text);

  editor.innerHTML = renderDocument(analysis);

  if (hasFocus) {
    setCaretOffset(editor, caretOffset);
  }

  updateStats(analysis.totals, analysis.overallGrade);
}

function scheduleAnalysis() {
  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = setTimeout(runAnalysis, DEBOUNCE_MS);
}

editor.addEventListener("input", scheduleAnalysis);

// Force paste to insert plain text only, so formatting/markup from the
// clipboard (e.g. copying from a rich text editor or a webpage) never ends
// up in the editor's DOM.
function insertPlainTextAtCaret(text) {
  const selection = window.getSelection();
  if (!selection.rangeCount) return;
  const range = selection.getRangeAt(0);
  range.deleteContents();
  const textNode = document.createTextNode(text);
  range.insertNode(textNode);
  range.setStartAfter(textNode);
  range.setEndAfter(textNode);
  selection.removeAllRanges();
  selection.addRange(range);
}

editor.addEventListener("paste", event => {
  event.preventDefault();
  const clipboardData = event.clipboardData || window.clipboardData;
  const text = clipboardData.getData("text/plain");
  if (document.queryCommandSupported && document.queryCommandSupported("insertText")) {
    document.execCommand("insertText", false, text);
  } else {
    insertPlainTextAtCaret(text);
  }
  scheduleAnalysis();
});

function loadInitialText(text) {
  const analysis = analyzeText(text);
  editor.innerHTML = renderDocument(analysis);
  updateStats(analysis.totals, analysis.overallGrade);
}

loadInitialText(DEFAULT_TEXT);

// --- Embedding bridge ---
//
// A stable, minimal surface for a host that embeds this page in a web view
// (the Android app passes in the text you selected in another app, and reads
// back whatever you edited). Keeping it to two functions means the host never
// reaches into the DOM or internals, so this file stays free to change.
window.hemingway = {
  setText(text) {
    loadInitialText(typeof text === "string" ? text : "");
  },
  getText() {
    return readEditorText(editor);
  },
  // Stats only, without touching the DOM. The Android floating panel reports on
  // text you are typing in a different app, so it needs the numbers without
  // rendering an editor it will never show. Returns a JSON string because that
  // is what survives the web view bridge intact.
  analyze(text) {
    const analysis = analyzeText(typeof text === "string" ? text : "");
    return JSON.stringify({
      grade: analysis.overallGrade,
      label: gradeLevelLabel(analysis.overallGrade),
      totals: analysis.totals
    });
  },
  // Character ranges to colour, absolute to `text`. The Android overlay pairs
  // these with per-character pixel rectangles from the accessibility API to
  // paint highlights directly over words in another app's text field, so it
  // needs positions rather than markup.
  highlights(text) {
    const analysis = analyzeText(typeof text === "string" ? text : "");
    return JSON.stringify(flattenHighlights(analysis));
  }
};

// --- Dark mode ---

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeToggle.checked = theme === "dark";
}

function initTheme() {
  const stored = localStorage.getItem(THEME_STORAGE_KEY);
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(stored || (prefersDark ? "dark" : "light"));
}

themeToggle.addEventListener("change", () => {
  const next = themeToggle.checked ? "dark" : "light";
  applyTheme(next);
  localStorage.setItem(THEME_STORAGE_KEY, next);
});

initTheme();
/* bundle:end */
  </script>
</body>
</html>
